# Ephemeral coordination store for the standalone session manager and API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccplant-redis
spec:
  replicas: 1
  selector:
    matchLabels: {app: ccplant-local-redis}
  template:
    metadata:
      labels: {app: ccplant-local-redis}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: [redis-server, --save, '', --appendonly, 'no']
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec:
              command: [redis-cli, ping]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ccplant-redis
spec:
  selector: {app: ccplant-local-redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}

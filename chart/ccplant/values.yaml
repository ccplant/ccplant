global:
  hostname: agentapi.local
  apiHostname: api.agentapi.local
  ingress:
    className: nginx
    tls:
      enabled: false

backend:
  enabled: true
  image:
    repository: ghcr.io/ccplant/ccplant-backend
  # Opt in to the lightweight control-plane image when session execution runs
  # in dedicated session-manager/worker deployments:
  # api:
  #   image:
  #     repository: ghcr.io/ccplant/ccplant-api
  ingress:
    enabled: false

frontend:
  enabled: true
  image:
    repository: ghcr.io/ccplant/ccplant-frontend
  ingress:
    enabled: false

global:
  hostname: agentapi.local
  apiHostname: api.agentapi.local
  ingress:
    className: nginx
    tls:
      enabled: false

backend:
  enabled: true
  # Full runtime image for compatibility/local process workloads.
  # Kubernetes sessions use the independently versioned ccplant-agent image.
  image:
    repository: ghcr.io/ccplant/ccplant-backend
  # Lightweight image used only by the backend API Deployment.
  api:
    githubBroker:
      # Use the backend Service directly for session GitHub token requests.
      inCluster: false
    image:
      repository: ghcr.io/ccplant/ccplant-api
  ingress:
    enabled: false

frontend:
  enabled: true
  image:
    repository: ghcr.io/ccplant/ccplant-frontend
  ingress:
    enabled: false

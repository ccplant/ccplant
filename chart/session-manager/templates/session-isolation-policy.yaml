{{- if or .Values.session.isolation.blockKubernetesAPI (eq .Values.session.isolation.egressMode "public-only") }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "session-manager.fullname" . }}-session-isolation
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: agentapi-proxy
      app.kubernetes.io/name: agentapi-session
      agentapi.proxy/session-manager-id: {{ include "session-manager.managerIdLabelValue" . | quote }}
  {{- if eq .Values.session.isolation.egressMode "public-only" }}
  # Permit public destinations, cluster DNS, and this release's session-manager
  # endpoint. Pool runners must call the local claim-pool-stock endpoint after
  # accepting an allocation; all other cluster-internal destinations remain
  # default-denied, including the kube-apiserver.
  egress:
    - toEntities:
        - world
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            k8s:app.kubernetes.io/component: session-manager
            k8s:app.kubernetes.io/instance: {{ .Release.Name | quote }}
      toPorts:
        - ports:
            - port: {{ .Values.service.port | quote }}
              protocol: TCP
  {{- else }}
  # A deny-only Cilium policy enables egress policy enforcement without allowing
  # any traffic. Keep the session's normal egress connectivity and rely on the
  # deny rule below to block only Kubernetes API access.
  egress:
    - {}
  egressDeny:
    - toEntities:
        - kube-apiserver
  {{- end }}
{{- end }}

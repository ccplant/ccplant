{{- $cfg := .Values.sessionPersistence | default dict -}}
{{- $persistence := $cfg.persistence | default dict -}}
{{- if and (eq ($cfg.backend | default "") "volume") ($persistence.enabled | default true) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "session-manager.fullname" . }}-session-state
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml ($persistence.accessModes | default (list "ReadWriteOnce")) | nindent 4 }}
  resources:
    requests:
      storage: {{ $persistence.size | default "5Gi" | quote }}
  {{- with $persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}

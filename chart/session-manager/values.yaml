replicaCount: 2

image:
  repository: ghcr.io/ccplant/ccplant-api
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Follow newer semantic versions advertised by the authenticated parent proxy.
autoUpgrade: true

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

parent:
  # Replace these example values before installing.
  url: https://parent.example.invalid
  connectionTokenSecretRef:
    name: session-manager-parent
    key: connection-token
  hmacSecretRef:
    name: session-manager-parent
    key: hmac-secret

runner:
  # Pool-backed sessions are claimed by idle runners; allocation is never
  # pre-assigned to this manager.
  managerId: replace-with-registered-manager-id
  pool: default

internalApi:
  tokenSecretRef:
    name: session-manager-internal
    key: token

encryption:
  keySecretRef:
    name: ""
    key: encryption-key

kvStore:
  backend: kubernetes
  namespace: ""

leaderElection:
  leaseDuration: 15s
  renewDeadline: 10s
  retryPeriod: 2s

sessionPersistence:
  backend: ""
  suspendAfter: 1h
  s3:
    bucket: ""
    region: garage
    prefix: agentapi-sessions/
    endpoint: ""
    accessKeyIdSecretRef:
      name: ""
      key: access-key-id
    secretAccessKeySecretRef:
      name: ""
      key: secret-access-key

session:
  image: "ghcr.io/ccplant/ccplant-agent:assets-068be2ef320224e336d7538c3a700bef"
  # CLI source follows the manager release; override for a custom registry.
  cliImage: ""
  serviceAccountName: agentapi-proxy-session
  isolation:
    # Hide Service-derived environment variables from session containers.
    disableServiceLinks: false
    # Do not mount the service account token, cluster CA, or namespace into sessions.
    disableServiceAccountToken: false
    # Requires Cilium. Preserves normal egress while denying the kube-apiserver entity.
    blockKubernetesAPI: false
    # Requires Cilium. Set to public-only to allow kube-dns and the Cilium
    # world entity while denying all other cluster-internal egress.
    egressMode: ""
  networkFilterImage: ghcr.io/ccplant/network-filter-agent:latest
  imagePullPolicy: IfNotPresent
  basePort: 9000
  podStartTimeout: 120
  podStopTimeout: 30
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 4Gi}
  pvc:
    # Automatically enabled when sessionPersistence.backend=volume.
    enabled: false
    storageClass: ""
    storageSize: 10Gi
  provisioner:
    tokenSecretRef:
      name: session-manager-provisioner
      key: provisioner-token

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
# Resources for the manager container; session.resources configures session Pods.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
extraEnvFrom: []

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">ccplant remote agent execution</title>
  <desc id="desc">Triggers start a ccplant session, which runs the selected agent on self-hosted infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071a1d"/><stop offset="1" stop-color="#0d3028"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2edc91"/><stop offset="1" stop-color="#159b65"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00100a" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#2edc91"/>
    </marker>
  </defs>
  <rect width="1120" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="150" fill="#2edc91" opacity=".06"/>
  <circle cx="70" cy="490" r="190" fill="#2edc91" opacity=".04"/>

  <g fill="#dce9e7" font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <text x="145" y="60" font-size="18" font-weight="700" letter-spacing="2">TRIGGERS</text>
    <g font-size="17" font-weight="600">
      <g transform="translate(40 92)"><rect width="210" height="54" rx="14" fill="#123c32"/><text x="105" y="34">Web UI / API</text></g>
      <g transform="translate(40 162)"><rect width="210" height="54" rx="14" fill="#123c32"/><text x="105" y="34">Schedule</text></g>
      <g transform="translate(40 232)"><rect width="210" height="54" rx="14" fill="#123c32"/><text x="105" y="34">Webhook</text></g>
      <g transform="translate(40 302)"><rect width="210" height="54" rx="14" fill="#123c32"/><text x="105" y="34">Slack</text></g>
    </g>

    <path d="M275 224h115" stroke="#2edc91" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(410 138)" filter="url(#shadow)">
      <rect width="300" height="172" rx="28" fill="url(#accent)"/>
      <path d="M150 58v65M150 78c-33 0-51-19-48-48 31-2 51 14 51 44M153 101c30 0 48-17 47-45-30-2-49 14-49 42" fill="none" stroke="#071a1d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="150" y="151" fill="#071a1d" font-size="24" font-weight="800">REMOTE SESSION</text>
    </g>
    <text x="560" y="342" fill="#7debbd" font-size="17" font-weight="600">Create · Run · Reconnect</text>

    <path d="M730 224h115" stroke="#2edc91" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(865 94)">
      <rect width="215" height="260" rx="24" fill="#102f29" stroke="#286455" stroke-width="2"/>
      <text x="108" y="42" fill="#7debbd" font-size="15" font-weight="700" letter-spacing="1.5">YOUR INFRA</text>
      <g font-size="17" font-weight="650">
        <rect x="20" y="62" width="175" height="48" rx="12" fill="#17453a"/><text x="108" y="92">Codex</text>
        <rect x="20" y="122" width="175" height="48" rx="12" fill="#17453a"/><text x="108" y="152">Claude Code</text>
        <rect x="20" y="182" width="175" height="48" rx="12" fill="#17453a"/><text x="108" y="212">Other agents</text>
      </g>
      <text x="108" y="249" fill="#8baaa2" font-size="13">Local · Kubernetes</text>
    </g>
  </g>
  <text x="560" y="466" fill="#dce9e7" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="650" text-anchor="middle">Choose the trigger. Choose the agent. Own the runtime.</text>
</svg>

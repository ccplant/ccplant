{{- $worker := .Values.worker | default dict }}
{{- if ($worker.enabled | default false) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentapi-proxy.fullname" . }}-worker-leases
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
subjects:
  - kind: ServiceAccount
    name: {{ include "agentapi-proxy.workerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "agentapi-proxy.fullname" . }}-worker-leases
  apiGroup: rbac.authorization.k8s.io
{{- end }}

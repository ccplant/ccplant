{{- if and .Values.controlPlaneService.enabled .Values.controlPlaneService.create }}
{{- $annotations := deepCopy (.Values.controlPlaneService.annotations | default dict) }}
{{- if .Values.controlPlaneService.retainOnDelete }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.controlPlaneService.name | quote }}
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.controlPlaneService.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- if .Values.controlPlaneService.selector }}
    {{- toYaml .Values.controlPlaneService.selector | nindent 4 }}
    {{- else }}
    {{- include "agentapi-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
    {{- end }}
{{- end }}

{{- if and .Values.kubernetesSession .Values.kubernetesSession.enabled .Values.kubernetesSession.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.kubernetesSession.serviceAccountName }}
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.kubernetesSession.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.kubernetesSession.serviceAccountName }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}

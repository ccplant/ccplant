apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentapi-proxy.fullname" . }}
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if (dig "enabled" false (.Values.api.metrics | default dict)) }}
    - port: {{ dig "port" 9090 (.Values.api.metrics | default dict) }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "agentapi-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy

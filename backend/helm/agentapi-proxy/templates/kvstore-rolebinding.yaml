{{- $api := .Values.api | default dict -}}
{{- $apiKV := $api.kvStore | default dict -}}
{{- $apiKubernetes := or (eq (dig "backend" "" $apiKV) "kubernetes") (eq (dig "primary" "backend" "" $apiKV) "kubernetes") (eq (dig "secondary" "backend" "" $apiKV) "kubernetes") -}}
{{- if $apiKubernetes }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentapi-proxy.fullname" . }}-kvstore
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: kvstore
subjects:
  {{- if $apiKubernetes }}
  - kind: ServiceAccount
    name: {{ include "agentapi-proxy.apiServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
  {{- end }}
roleRef:
  kind: Role
  name: {{ include "agentapi-proxy.fullname" . }}-kvstore
  apiGroup: rbac.authorization.k8s.io
{{- end }}

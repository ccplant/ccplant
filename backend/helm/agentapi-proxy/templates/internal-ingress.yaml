{{- if .Values.internalIngress.enabled -}}
{{- $cfg := .Values.internalIngress -}}
{{- if not $cfg.allowedCIDRs -}}
{{- fail "internalIngress.allowedCIDRs must contain at least one CIDR when internalIngress.enabled=true" -}}
{{- end -}}
{{- $className := $cfg.className | default .Values.ingress.className -}}
{{- if .Values.global -}}
  {{- if .Values.global.ingress -}}
    {{- $className = $cfg.className | default (.Values.global.ingress.className | default .Values.ingress.className) -}}
  {{- end -}}
{{- end -}}
{{- $defaultHostname := .Values.config.hostname -}}
{{- $frontendHostname := "" -}}
{{- if .Values.global -}}
  {{- $defaultHostname = .Values.global.apiHostname | default .Values.config.hostname -}}
  {{- $frontendHostname = .Values.global.hostname | default "" -}}
{{- end -}}
{{- $hosts := $cfg.hosts -}}
{{- if not $hosts -}}
  {{- $hosts = list (dict "host" $defaultHostname "paths" (list (dict "path" $cfg.path "pathType" $cfg.pathType))) -}}
  {{- if and $frontendHostname (ne $frontendHostname $defaultHostname) -}}
    {{- $hosts = append $hosts (dict "host" $frontendHostname "paths" (list (dict "path" "/api/v1/internal" "pathType" "Prefix") (dict "path" "/api/proxy/internal" "pathType" "Prefix"))) -}}
  {{- end -}}
{{- end -}}
{{- $annotations := deepCopy ($cfg.annotations | default dict) -}}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/whitelist-source-range" (join "," $cfg.allowedCIDRs) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentapi-proxy.fullname" . }}-internal
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- if $className }}
  ingressClassName: {{ $className }}
  {{- end }}
  {{- with $cfg.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hostConfig := $hosts }}
    {{- $hostname := $hostConfig }}
    {{- $paths := list (dict "path" $cfg.path "pathType" $cfg.pathType) }}
    {{- if kindIs "map" $hostConfig }}
      {{- $hostname = $hostConfig.host }}
      {{- $paths = $hostConfig.paths | default $paths }}
    {{- end }}
    - host: {{ $hostname | quote }}
      http:
        paths:
          {{- range $pathConfig := $paths }}
          - path: {{ $pathConfig.path }}
            pathType: {{ $pathConfig.pathType | default $cfg.pathType }}
            backend:
              service:
                name: {{ include "agentapi-proxy.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}

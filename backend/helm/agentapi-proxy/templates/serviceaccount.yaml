{{- $api := .Values.api | default dict -}}
{{- $apiSA := $api.serviceAccount | default .Values.serviceAccount -}}
{{- if $apiSA.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentapi-proxy.apiServiceAccountName" . }}
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
  {{- with $apiSA.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- $worker := .Values.worker | default dict }}
{{- $workerSA := $worker.serviceAccount | default dict }}
{{- if and ($worker.enabled | default false) ($workerSA.create | default false) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentapi-proxy.workerServiceAccountName" . }}
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with $workerSA.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- $manager := .Values.sessionManager | default dict }}
{{- $managerSA := $manager.serviceAccount | default dict }}
{{- if and ($manager.enabled | default false) ($managerSA.create | default false) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentapi-proxy.sessionManagerServiceAccountName" . }}
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-manager
  {{- with $managerSA.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $managerSA.automount | default true }}
{{- end }}

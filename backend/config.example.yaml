# Example configuration file for agentapi-proxy

# Executable used by generated hooks and child processes.
# May also be set with CCPLANT_BINARY_PATH.
binary_path: ccplant
# This file demonstrates all available configuration options
# Values can be overridden by environment variables with AGENTAPI_ prefix

# Persistence for application KV data represented as Secrets and ConfigMaps.
# Inject auth_token with AGENTAPI_KV_STORE_AUTH_TOKEN in production.
kv_store:
  # kubernetes, libsql (plaintext), or libsql-encrypted
  backend: kubernetes
  database_url: ""
  auth_token: ""
  # To mirror application KV writes, replace the legacy fields above with:
  # primary:
  #   backend: kubernetes
  # secondary:
  #   backend: libsql-encrypted
  #   database_url: "libsql://example.turso.io"
  #   auth_token: ""
  #   encryption:
  #     provider: aws-kms-branch
  #     active_key_id: production
  #     kms_region: ap-northeast-1
  #     keys:
  #       production: arn:aws:kms:ap-northeast-1:123456789012:key/example
  # replication:
  #   mode: rollback # rollback or best_effort

# Authentication configuration
auth:
  enabled: false

  # Single admin API key. Prefer the AGENTAPI_AUTH_ADMIN_KEY environment
  # variable over config files so the value never lands in version control.
  # Requests with `X-API-Key: <admin key>` authenticate as an admin user.
  admin_key: ""

  # GitHub OAuth authentication
  github:
    enabled: false
    base_url: "https://api.github.com"
    token_header: "Authorization"
    
    # User role mapping
    user_mapping:
      default_role: "user"
      default_permissions: ["session:create"]
      team_role_mapping: {}
    
    # OAuth configuration
    oauth:
      client_id: "${AGENTAPI_AUTH_GITHUB_OAUTH_CLIENT_ID}"
      client_secret: "${AGENTAPI_AUTH_GITHUB_OAUTH_CLIENT_SECRET}"
      scope: "read:user read:org project"
      base_url: ""  # Defaults to auth.github.base_url
# Dedicated libSQL persistence for response-level token usage.
usage:
  enabled: false
  database_url: ""
  auth_token: ""

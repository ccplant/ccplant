openapi: 3.1.0
info:
  title: ccplant E2E API
  version: 0.1.0
paths:
  /api/v1/scenarios:
    get:
      operationId: listScenarios
      responses:
        "200": {description: Scenario catalog}
  /api/v1/runs:
    get:
      operationId: listRuns
      parameters:
        - {name: category, in: query, schema: {type: string}}
        - {name: scenario_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        "200": {description: Runs}
    post:
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario_id]
              properties:
                scenario_id: {type: string}
                environment: {type: string, default: local}
                parameters: {type: object, additionalProperties: true}
      responses:
        "201": {description: Created run}
        "400": {description: Invalid scenario or parameters}
  /api/v1/runs/{id}:
    get:
      operationId: getRun
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Run and events}
        "404": {description: Run not found}
  /api/v1/runs/{id}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "202": {description: Cancellation requested}
  /api/v1/runs/{id}/events:
    get:
      operationId: streamRunEvents
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Server-sent run events
          content:
            text/event-stream: {schema: {type: string}}

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ccplant/ccplant-backend
  FRONTEND_IMAGE: ccplant/ccplant-frontend

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  binaries:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            image: ccplant/ccplant-backend
          - component: frontend
            image: ccplant/ccplant-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ needs.metadata.outputs.tag }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  chart:
    needs: [metadata, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Set release version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" chart/ccplant/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \\\"${VERSION}\\\"/" chart/ccplant/Chart.yaml
          sed -i "s/tag: v0.1.0/tag: ${TAG}/g" chart/ccplant/values.yaml
      - run: helm dependency build chart/ccplant
      - run: helm lint chart/ccplant --strict
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - run: helm package chart/ccplant --destination dist
      - run: helm push "dist/ccplant-${{ needs.metadata.outputs.version }}.tgz" oci://ghcr.io/ccplant/charts

  release-complete:
    needs: [binaries, images, chart]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ccplant/ccplant-backend
  FRONTEND_IMAGE: ccplant/ccplant-frontend

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  binaries:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - component: backend
            image: ccplant/ccplant-backend
            platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - component: backend
            image: ccplant/ccplant-backend
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - component: frontend
            image: ccplant/ccplant-frontend
            platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - component: frontend
            image: ccplant/ccplant-frontend
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifests:
    needs: [metadata, images]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - component: backend
            image: ccplant/ccplant-backend
          - component: frontend
            image: ccplant/ccplant-frontend
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.component }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

  charts:
    needs: [metadata, image-manifests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agentapi-proxy
            path: backend/helm/agentapi-proxy
            dependencies: true
          - name: agentapi-ui
            path: frontend/helm/agentapi-ui
            dependencies: false
          - name: ccplant
            path: chart/ccplant
            dependencies: true
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Set release version
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          CHART_PATH: ${{ matrix.path }}
          CHART_NAME: ${{ matrix.name }}
        run: |
          if [ "${CHART_NAME}" = "ccplant" ]; then
            sed -i "s/^version:.*/version: ${VERSION}/" "${CHART_PATH}/Chart.yaml"
            sed -i "s/^appVersion:.*/appVersion: \\\"${VERSION}\\\"/" "${CHART_PATH}/Chart.yaml"
            sed -i "s/tag: v0.1.0/tag: ${TAG}/g" "${CHART_PATH}/values.yaml"
          else
            sed -i "s/^version:.*/version: ${TAG}/" "${CHART_PATH}/Chart.yaml"
            sed -i "s/^appVersion:.*/appVersion: \\\"${TAG}\\\"/" "${CHART_PATH}/Chart.yaml"
          fi
      - name: Build dependencies
        if: matrix.dependencies
        run: helm dependency build "${{ matrix.path }}"
      - run: helm lint "${{ matrix.path }}" --strict
      - run: helm template "${{ matrix.name }}" "${{ matrix.path }}" >/dev/null
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - run: helm package "${{ matrix.path }}" --destination dist
      - name: Push chart
        env:
          CHART_NAME: ${{ matrix.name }}
        run: helm push "$(find dist -maxdepth 1 -name "${CHART_NAME}-*.tgz" -print -quit)" oci://ghcr.io/ccplant/charts

  release-complete:
    needs: [binaries, images, charts]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest

name: Agent assets image

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          tag=$(scripts/agent-image-tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          scripts/check-agent-image-tag.sh
  publish:
    needs: metadata
    runs-on: ubuntu-24.04
    # Never race two publishers for the same immutable asset tag.
    concurrency:
      group: agent-assets-${{ needs.metadata.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: existing
        env:
          IMAGE: ghcr.io/ccplant/ccplant-agent:${{ needs.metadata.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE"; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish previously unseen assets
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ccplant/ccplant-agent:${{ needs.metadata.outputs.tag }}
          cache-from: type=gha,scope=agent-assets
          cache-to: type=gha,mode=max,scope=agent-assets
      - name: Smoke-test the injected CLI with agent assets
        env:
          IMAGE: ghcr.io/ccplant/ccplant-agent:${{ needs.metadata.outputs.tag }}
        run: |
          docker build --target api -t ccplant-cli-test backend
          volume=$(docker volume create)
          trap 'docker volume rm "$volume"' EXIT
          docker run --rm --user 0 -v "$volume:/opt/ccplant/bin" --entrypoint /bin/sh ccplant-cli-test \
            -ec 'chown 999:999 /opt/ccplant/bin'
          # Run twice: initContainer retries must replace an already read-only CLI.
          for attempt in 1 2; do
            docker run --rm --user 999:999 -v "$volume:/opt/ccplant/bin" --entrypoint /bin/sh ccplant-cli-test \
              -ec 'cp -f /usr/local/bin/ccplant /opt/ccplant/bin/ccplant && chmod 0555 /opt/ccplant/bin/ccplant'
          done
          docker run --rm --user 999:999 -v "$volume:/opt/ccplant/bin:ro" --entrypoint /bin/sh "$IMAGE" \
            -ec 'ccplant --help; agentapi --help; claude --version; codex --version; command -v claude-agent-acp codex-acp pi pi-acp cursor-agent otelcol github-mcp-server'

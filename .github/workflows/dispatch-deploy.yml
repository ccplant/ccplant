name: Dispatch deployment

on:
  workflow_run:
    workflows:
      - CI
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the published artifacts to the development environment
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  agent-image:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/agent-image.yml
    with:
      source_ref: ${{ github.event.workflow_run.head_sha }}

  dispatch-production:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Release' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - id: image
        name: Resolve released API image digest
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]
          tagged="ghcr.io/ccplant/ccplant-api:${RELEASE_TAG}"
          digest="sha256:$(docker buildx imagetools inspect "$tagged" --raw | sha256sum | cut -d' ' -f1)"
          echo "image=ghcr.io/ccplant/ccplant-api@${digest}" >> "$GITHUB_OUTPUT"

      - name: Dispatch production deployment
        env:
          GH_TOKEN: ${{ secrets.CCPLANT_DEPLOY_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          API_IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          printf '%s' "$FLY_API_TOKEN" | gh secret set FLY_API_TOKEN --repo ccplant/ccplant-deploy --env production
          jq -n \
            --arg environment production \
            --arg api_image "$API_IMAGE" \
            --arg source_sha "$SOURCE_SHA" \
            '{event_type:"deploy",client_payload:{environment:$environment,api_image:$api_image,source_sha:$source_sha}}' \
            | gh api --method POST repos/ccplant/ccplant-deploy/dispatches --input -

  prepare-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: source
        name: Resolve source commit
        run: |
          source_sha=$(git rev-parse HEAD)
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  manual-agent-image:
    needs: prepare-manual
    uses: ./.github/workflows/agent-image.yml
    with:
      source_ref: ${{ needs.prepare-manual.outputs.source_sha }}

  manual-browser-image:
    needs: prepare-manual
    uses: ./.github/workflows/browser-image.yml
    with:
      source_ref: ${{ needs.prepare-manual.outputs.source_sha }}

  publish-manual-dev-images:
    needs: prepare-manual
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ format('ghcr.io/ccplant/ccplant-api@{0}', steps.api.outputs.digest) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-manual.outputs.source_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: api
        name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: api
          build-args: RELEASE_VERSION=dev.ccplant.${{ needs.prepare-manual.outputs.source_sha }}
          push: true
          tags: ghcr.io/ccplant/ccplant-api:dev.ccplant.${{ needs.prepare-manual.outputs.source_sha }}
          cache-from: type=gha,scope=deploy-manual-api
          cache-to: type=gha,mode=max,scope=deploy-manual-api

      - name: Build and publish session runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: RELEASE_VERSION=dev.ccplant.${{ needs.prepare-manual.outputs.source_sha }}
          push: true
          tags: ghcr.io/ccplant/ccplant-backend:dev.ccplant.${{ needs.prepare-manual.outputs.source_sha }}
          cache-from: type=gha,scope=deploy-manual-backend
          cache-to: type=gha,mode=max,scope=deploy-manual-backend

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/ccplant/ccplant-frontend:dev.ccplant.${{ needs.prepare-manual.outputs.source_sha }}
          cache-from: type=gha,scope=deploy-manual-frontend
          cache-to: type=gha,mode=max,scope=deploy-manual-frontend

  publish-manual-dev-charts:
    needs: [prepare-manual, manual-agent-image, manual-browser-image, publish-manual-dev-images]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agentapi-proxy
            path: backend/helm/agentapi-proxy
            base-version: 0.3.0
            dependencies: true
          - name: agentapi-ui
            path: frontend/helm/agentapi-ui
            base-version: 0.1.0
            dependencies: false
          - name: session-manager
            path: chart/session-manager
            base-version: 0.1.0
            dependencies: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-manual.outputs.source_sha }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Build dependencies
        if: matrix.dependencies
        run: helm dependency build "${{ matrix.path }}"
      - name: Package development chart
        env:
          SOURCE_SHA: ${{ needs.prepare-manual.outputs.source_sha }}
        run: |
          short_sha="${SOURCE_SHA:0:7}"
          helm package "${{ matrix.path }}" \
            --version "${{ matrix.base-version }}-dev.ccplant.${short_sha}" \
            --app-version "dev.ccplant.${SOURCE_SHA}" \
            --destination dist
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Push development chart
        env:
          CHART_NAME: ${{ matrix.name }}
        run: helm push "$(find dist -maxdepth 1 -name "${CHART_NAME}-*.tgz" -print -quit)" oci://ghcr.io/ccplant/charts

  dispatch-manual-dev:
    if: inputs.deploy
    needs: [prepare-manual, publish-manual-dev-images, publish-manual-dev-charts]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch development deployment
        env:
          GH_TOKEN: ${{ secrets.CCPLANT_DEPLOY_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          API_IMAGE: ${{ needs.publish-manual-dev-images.outputs.api_image }}
          SOURCE_SHA: ${{ needs.prepare-manual.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$API_IMAGE" =~ ^ghcr\.io/ccplant/ccplant-api@sha256:[a-f0-9]{64}$ ]]
          test -n "$FLY_API_TOKEN"
          printf '%s' "$FLY_API_TOKEN" | gh secret set FLY_API_TOKEN --repo ccplant/ccplant-deploy --env dev
          jq -n \
            --arg environment dev \
            --arg api_image "$API_IMAGE" \
            --arg source_sha "$SOURCE_SHA" \
            '{event_type:"deploy",client_payload:{environment:$environment,api_image:$api_image,source_sha:$source_sha}}' \
            | gh api --method POST repos/ccplant/ccplant-deploy/dispatches --input -

name: Dispatch deployment

on:
  workflow_run:
    workflows:
      - CI
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - production
      source_ref:
        description: Git ref to build and deploy (branch, tag, or commit SHA)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  agent-image:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/agent-image.yml

  dev-image:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        name: Build and publish development API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: api
          build-args: RELEASE_VERSION=dev.ccplant.${{ github.event.workflow_run.head_sha }}
          push: true
          tags: ghcr.io/ccplant/ccplant-api:dev.ccplant.${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=deploy-dev-api
          cache-to: type=gha,mode=max,scope=deploy-dev-api

      - name: Smoke-test development API image
        env:
          API_IMAGE: ghcr.io/ccplant/ccplant-api:dev.ccplant.${{ github.event.workflow_run.head_sha }}
          EXPECTED_VERSION: dev.ccplant.${{ github.event.workflow_run.head_sha }}
        run: |
          docker pull "$API_IMAGE"
          network=$(docker network create ccplant-api-test)
          redis_id=$(docker run --detach --network "$network" --name ccplant-api-test-redis redis:7-alpine)
          container_id=$(docker run --detach --network "$network" --env AGENTAPI_REDIS_ADDR=ccplant-api-test-redis:6379 --publish 127.0.0.1::8080 "$API_IMAGE")
          trap 'docker rm --force "$container_id" "$redis_id" >/dev/null; docker network rm "$network" >/dev/null' EXIT
          host_port=$(docker port "$container_id" 8080/tcp | sed 's/.*://')
          for attempt in {1..30}; do
            if test "$(curl --fail --silent "http://127.0.0.1:${host_port}/health" | jq -r .version)" = "$EXPECTED_VERSION"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          docker run --rm "$API_IMAGE" worker --help >/dev/null
          test "$(docker exec "$container_id" id -u)" = 999
          docker exec "$container_id" codex --version
          for command in claude cursor-agent docker git mise uv github-mcp-server otelcol node npm; do
            if docker exec "$container_id" sh -c "command -v $command"; then
              echo "unexpected runtime tool: $command"
              exit 1
            fi
          done

      # Session managers follow the API version reported by /health and update
      # both themselves and newly provisioned Session Pods from this repository.
      # Publishing only the API target leaves that rollout in ImagePullBackOff.
      - name: Build and publish development session runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: RELEASE_VERSION=dev.ccplant.${{ github.event.workflow_run.head_sha }}
          push: true
          tags: ghcr.io/ccplant/ccplant-backend:dev.ccplant.${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=deploy-dev-backend
          cache-to: type=gha,mode=max,scope=deploy-dev-backend

      - name: Build and publish development frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/ccplant/ccplant-frontend:dev.ccplant.${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=deploy-dev-frontend
          cache-to: type=gha,mode=max,scope=deploy-dev-frontend

      - id: reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=ghcr.io/ccplant/ccplant-api@${DIGEST}" >> "$GITHUB_OUTPUT"

  publish-dev-charts:
    needs: [agent-image, dev-image]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agentapi-proxy
            path: backend/helm/agentapi-proxy
            base-version: 0.3.0
            dependencies: true
          - name: agentapi-ui
            path: frontend/helm/agentapi-ui
            base-version: 0.1.0
            dependencies: false
          - name: session-manager
            path: chart/session-manager
            base-version: 0.1.0
            dependencies: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Build dependencies
        if: matrix.dependencies
        run: helm dependency build "${{ matrix.path }}"
      - name: Package development chart
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          short_sha="${HEAD_SHA:0:7}"
          helm package "${{ matrix.path }}" \
            --version "${{ matrix.base-version }}-dev.ccplant.${short_sha}" \
            --app-version "dev.ccplant.${HEAD_SHA}" \
            --destination dist
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Push development chart
        env:
          CHART_NAME: ${{ matrix.name }}
        run: helm push "$(find dist -maxdepth 1 -name "${CHART_NAME}-*.tgz" -print -quit)" oci://ghcr.io/ccplant/charts

  dev-contracts:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [schedule, webhook, slackbot, session-manager]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Run deterministic ${{ matrix.feature }} contract
        run: make ${{ matrix.feature }}-test

  dispatch-dev:
    needs: [dev-image, publish-dev-charts, dev-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch development deployment
        env:
          GH_TOKEN: ${{ secrets.CCPLANT_DEPLOY_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          API_IMAGE: ${{ needs.dev-image.outputs.image }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          printf '%s' "$FLY_API_TOKEN" | gh secret set FLY_API_TOKEN --repo ccplant/ccplant-deploy --env dev
          jq -n \
            --arg environment dev \
            --arg api_image "$API_IMAGE" \
            --arg source_sha "$SOURCE_SHA" \
            '{event_type:"deploy",client_payload:{environment:$environment,api_image:$api_image,source_sha:$source_sha}}' \
            | gh api --method POST repos/ccplant/ccplant-deploy/dispatches --input -

  dispatch-production:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Release' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - id: image
        name: Resolve released API image digest
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]
          tagged="ghcr.io/ccplant/ccplant-api:${RELEASE_TAG}"
          digest="sha256:$(docker buildx imagetools inspect "$tagged" --raw | sha256sum | cut -d' ' -f1)"
          echo "image=ghcr.io/ccplant/ccplant-api@${digest}" >> "$GITHUB_OUTPUT"

      - name: Dispatch production deployment
        env:
          GH_TOKEN: ${{ secrets.CCPLANT_DEPLOY_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          API_IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          printf '%s' "$FLY_API_TOKEN" | gh secret set FLY_API_TOKEN --repo ccplant/ccplant-deploy --env production
          jq -n \
            --arg environment production \
            --arg api_image "$API_IMAGE" \
            --arg source_sha "$SOURCE_SHA" \
            '{event_type:"deploy",client_payload:{environment:$environment,api_image:$api_image,source_sha:$source_sha}}' \
            | gh api --method POST repos/ccplant/ccplant-deploy/dispatches --input -

  dispatch-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: source
        name: Resolve source commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: api
        name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: api
          build-args: RELEASE_VERSION=dev.ccplant.${{ steps.source.outputs.sha }}
          push: true
          tags: ghcr.io/ccplant/ccplant-api:dev.ccplant.${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=deploy-manual-api
          cache-to: type=gha,mode=max,scope=deploy-manual-api

      - name: Build and publish session runtime image
        if: false
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: RELEASE_VERSION=dev.ccplant.${{ steps.source.outputs.sha }}
          push: true
          tags: ghcr.io/ccplant/ccplant-backend:dev.ccplant.${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=deploy-manual-backend
          cache-to: type=gha,mode=max,scope=deploy-manual-backend

      - name: Build and publish frontend image
        if: false
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/ccplant/ccplant-frontend:dev.ccplant.${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=deploy-manual-frontend
          cache-to: type=gha,mode=max,scope=deploy-manual-frontend

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Package and publish session-manager chart
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:7}"
          version="0.1.0-dev.ccplant.${short_sha}"
          helm package chart/session-manager \
            --version "$version" \
            --app-version "dev.ccplant.${SOURCE_SHA}" \
            --destination /tmp
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "/tmp/session-manager-${version}.tgz" oci://ghcr.io/ccplant/charts

      - name: Dispatch manual deployment
        if: false
        env:
          GH_TOKEN: ${{ secrets.CCPLANT_DEPLOY_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
          API_IMAGE: ghcr.io/ccplant/ccplant-api@${{ steps.api.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$API_IMAGE" =~ ^ghcr\.io/ccplant/ccplant-api@sha256:[a-f0-9]{64}$ ]]
          test -n "$FLY_API_TOKEN"
          printf '%s' "$FLY_API_TOKEN" | gh secret set FLY_API_TOKEN --repo ccplant/ccplant-deploy --env "$ENVIRONMENT"
          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg api_image "$API_IMAGE" \
            --arg source_sha "$SOURCE_SHA" \
            '{event_type:"deploy",client_payload:{environment:$environment,api_image:$api_image,source_sha:$source_sha}}' \
            | gh api --method POST repos/ccplant/ccplant-deploy/dispatches --input -

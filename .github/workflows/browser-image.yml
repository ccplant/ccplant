name: Browser image

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref containing the browser image definition
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - id: tag
        run: echo "tag=$(scripts/browser-image-tag.sh)" >> "$GITHUB_OUTPUT"

  publish:
    needs: metadata
    runs-on: ubuntu-24.04
    concurrency:
      group: browser-${{ needs.metadata.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: existing
        env:
          IMAGE: ghcr.io/ccplant/ccplant-browser:${{ needs.metadata.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE"; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish immutable browser image
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./browser
          file: ./browser/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ccplant/ccplant-browser:${{ needs.metadata.outputs.tag }}
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser
          provenance: mode=max
          sbom: true
      - name: Smoke-test version and CDP discovery
        env:
          IMAGE: ghcr.io/ccplant/ccplant-browser:${{ needs.metadata.outputs.tag }}
        run: |
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" --version
          docker run --rm --entrypoint fc-match "$IMAGE" \
            -f '%{family}\n' ':lang=ja' | grep -F 'Noto Sans CJK JP'
          container=$(docker run -d --read-only --tmpfs /tmp:uid=999,gid=999 \
            -p 127.0.0.1::9222 "$IMAGE" serve --host 0.0.0.0 --port 9222)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$container" 9222/tcp | sed 's/.*://')
          for _ in $(seq 1 30); do
            if response=$(curl -fsS "http://127.0.0.1:${port}/json/version"); then
              break
            fi
            sleep 1
          done
          test -n "${response:-}"
          jq -e '."Browser" | strings | length > 0' <<<"$response"
      - name: Point latest at the tested immutable image
        env:
          IMAGE: ghcr.io/ccplant/ccplant-browser
          TAG: ${{ needs.metadata.outputs.tag }}
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${TAG}"

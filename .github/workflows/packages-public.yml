name: Publish packages

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Make release packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in ccplant-backend ccplant-frontend charts%2Fccplant; do
            gh api --method PATCH \
              "orgs/ccplant/packages/container/${package}" \
              -f visibility=public
          done

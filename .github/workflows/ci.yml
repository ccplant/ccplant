name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
        working-directory: backend
      - run: go build ./...
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run type-check
        working-directory: frontend
      - run: bun run test
        working-directory: frontend
      - run: bun run build
        working-directory: frontend

  charts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            path: backend/helm/agentapi-proxy
            compatibility-name: agentapi-proxy
            dependencies: true
          - name: frontend
            path: frontend/helm/agentapi-ui
            compatibility-name: agentapi-ui
            dependencies: false
          - name: ccplant
            path: chart/ccplant
            dependencies: true
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Build dependencies
        if: matrix.dependencies
        run: helm dependency build "${{ matrix.path }}"
      - run: helm lint "${{ matrix.path }}" --strict
      - name: Render chart
        run: helm template "${{ matrix.name }}" "${{ matrix.path }}" >/dev/null

  publish-dev-charts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            path: backend/helm/agentapi-proxy
            context: backend
            image: ccplant/ccplant-backend
            base-version: 0.3.0
            dependencies: true
          - name: frontend
            path: frontend/helm/agentapi-ui
            context: frontend
            image: ccplant/ccplant-frontend
            base-version: 0.1.0
            dependencies: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push development image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ matrix.image }}:dev.ccplant.${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Build dependencies
        if: matrix.dependencies
        run: helm dependency build "${{ matrix.path }}"
      - name: Package development chart
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short_sha="${HEAD_SHA:0:7}"
          helm package "${{ matrix.path }}" \
            --version "${{ matrix.base-version }}-dev.ccplant.${short_sha}" \
            --app-version "dev.ccplant.${HEAD_SHA}" \
            --destination dist
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Push development chart
        env:
          CHART_NAME: ${{ matrix.name }}
        run: helm push "$(find dist -maxdepth 1 -name "${CHART_NAME}-*.tgz" -print -quit)" oci://ghcr.io/ccplant/charts
      - name: Push compatibility chart for existing development release
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMPATIBILITY_NAME: ${{ matrix.compatibility-name }}
        run: |
          short_sha="${HEAD_SHA:0:7}"
          compatibility_dir="${RUNNER_TEMP}/${COMPATIBILITY_NAME}"
          cp -a "${{ matrix.path }}" "${compatibility_dir}"
          sed -i "s/^name:.*/name: ${COMPATIBILITY_NAME}/" "${compatibility_dir}/Chart.yaml"
          helm package "${compatibility_dir}" \
            --version "${{ matrix.base-version }}-dev.ccplant.${short_sha}" \
            --app-version "dev.ccplant.${HEAD_SHA}" \
            --destination compatibility-dist
          helm push \
            "$(find compatibility-dist -maxdepth 1 -name "${COMPATIBILITY_NAME}-*.tgz" -print -quit)" \
            oci://ghcr.io/ccplant/charts

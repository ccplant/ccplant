name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
        working-directory: backend
      - run: go build ./...
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run type-check
        working-directory: frontend
      - run: bun run test
        working-directory: frontend
      - run: bun run build
        working-directory: frontend

  charts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agentapi-proxy
            path: backend/helm/agentapi-proxy
            dependencies: true
          - name: agentapi-ui
            path: frontend/helm/agentapi-ui
            dependencies: false
          - name: ccplant
            path: chart/ccplant
            dependencies: true
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Build dependencies
        if: matrix.dependencies
        run: helm dependency build "${{ matrix.path }}"
      - run: helm lint "${{ matrix.path }}" --strict
      - name: Render chart
        run: helm template "${{ matrix.name }}" "${{ matrix.path }}" >/dev/null

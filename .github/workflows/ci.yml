name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      native: ${{ steps.filter.outputs.native }}
      charts: ${{ steps.filter.outputs.charts }}
      schedule: ${{ steps.filter.outputs.schedule }}
      runtime_contracts: ${{ steps.filter.outputs.runtime_contracts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect affected components
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          backend=false
          frontend=false
          native=false
          charts=false
          schedule=false
          runtime_contracts=false

          # A workflow change can affect every build, so exercise the complete CI.
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml)
                backend=true; frontend=true; native=true; charts=true; schedule=true; runtime_contracts=true ;;
              Makefile)
                backend=true; frontend=true; native=true; charts=true; schedule=true; runtime_contracts=true ;;
              backend/internal/modules/schedule/*|backend/internal/interfaces/controllers/worker_control*|backend/internal/infrastructure/controlapi/*|backend/cmd/worker.go|frontend/src/app/schedules/*|frontend/src/app/components/Schedule*|frontend/src/app/components/__tests__/Schedule*|frontend/src/types/schedule.ts|frontend/src/lib/agentapi-proxy-client.ts)
                schedule=true ;;&
              backend/internal/modules/webhook/*|backend/internal/modules/slackbot/*|backend/internal/modules/sessionmanager/*|backend/internal/infrastructure/esmcontrol/*|backend/internal/interfaces/controllers/external_session_manager*|frontend/src/app/webhooks/*|frontend/src/app/slackbots/*|frontend/src/app/settings/*/session-managers/*|frontend/src/app/settings/team/*/session-managers/*|frontend/src/app/settings/sections/SessionManagersSection.tsx|frontend/src/app/components/Webhook*|frontend/src/app/components/Slackbot*|frontend/src/app/components/__tests__/Webhook*|frontend/src/app/components/__tests__/Slackbot*|frontend/src/components/settings/ExternalSessionManager*|frontend/src/components/settings/__tests__/ExternalSessionManager*|frontend/src/types/webhook.ts|frontend/src/types/slackbot.ts)
                runtime_contracts=true ;;&
              backend/helm/*|frontend/helm/*|chart/*)
                charts=true ;;
              backend/*)
                backend=true ;;
              frontend/*)
                frontend=true ;;
              native/*)
                native=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "charts=$charts" >> "$GITHUB_OUTPUT"
          echo "schedule=$schedule" >> "$GITHUB_OUTPUT"
          echo "runtime_contracts=$runtime_contracts" >> "$GITHUB_OUTPUT"

  schedule-contract:
    needs: changes
    if: needs.changes.outputs.schedule == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Run deterministic schedule contract
        run: make schedule-test

  runtime-contracts:
    needs: changes
    if: needs.changes.outputs.runtime_contracts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [webhook, slackbot, session-manager]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Run deterministic ${{ matrix.feature }} contract
        run: make ${{ matrix.feature }}-test

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
        working-directory: backend
      - run: go build ./...
        working-directory: backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run type-check
        working-directory: frontend
      - run: bun run test
        working-directory: frontend
      - run: bun run build
        working-directory: frontend

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
      - run: bun install --frozen-lockfile
        working-directory: native
      - run: bun run check
        working-directory: native
      - run: bun run sidecar:build
        working-directory: native
      - run: bun run tauri build --no-bundle
        working-directory: native

  charts:
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agentapi-proxy
            path: backend/helm/agentapi-proxy
            dependencies: true
          - name: agentapi-ui
            path: frontend/helm/agentapi-ui
            dependencies: false
          - name: ccplant
            path: chart/ccplant
            dependencies: true
          - name: session-manager
            path: chart/session-manager
            dependencies: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Build dependencies
        if: matrix.dependencies
        run: helm dependency build "${{ matrix.path }}"
      - run: helm lint "${{ matrix.path }}" --strict
      - name: Render chart
        run: helm template "${{ matrix.name }}" "${{ matrix.path }}" >/dev/null
      - name: Verify GitHub Enterprise session configuration compatibility
        if: matrix.name == 'agentapi-proxy'
        run: |
          rendered="$(mktemp)"
          helm template agentapi-proxy "${{ matrix.path }}" \
            --set sessionManager.enabled=true \
            --set sessionManager.internalApi.tokenSecretRef.name=internal-api \
            --set api.sessionManager.url=http://session-manager:8080 \
            --set api.sessionManager.tokenSecretRef.name=internal-api \
            --set sessionManager.kubernetesSession.provisioner.tokenSecretRef.name=provisioner \
            --set sessionManager.kvStore.databaseUrl=file:///tmp/session-manager.db \
            --set github.enterprise.enabled=true \
            --set github.enterprise.baseUrl=https://ghe.example.com \
            --set github.enterprise.apiUrl=https://ghe.example.com/api/v3 \
            --set-string github.app.id=12345 \
            --set-string github.app.installationId=67890 \
            --set github.app.privateKey.secretName=github-app-key \
            >"$rendered"
          grep -q 'name: agentapi-proxy-github-session' "$rendered"
          grep -q 'GITHUB_APP_ID: "12345"' "$rendered"
          grep -q 'GITHUB_INSTALLATION_ID: "67890"' "$rendered"
          grep -q 'name: agentapi-proxy-github-config' "$rendered"
          grep -q 'GITHUB_URL: "https://ghe.example.com"' "$rendered"
          grep -q 'GITHUB_API: "https://ghe.example.com/api/v3"' "$rendered"
          grep -q 'value: "agentapi-proxy-github-config"' "$rendered"
      - name: Render Cloud Run manifest
        if: matrix.name == 'agentapi-proxy'
        run: |
          helm template agentapi-proxy "${{ matrix.path }}" \
            --show-only templates/cloud-run-service.yaml \
            --set cloudRun.enabled=true \
            --set cloudRun.service.name=ccplant-api-test \
            --set cloudRun.service.project=ccplant-test \
            --set cloudRun.service.region=asia-northeast1 \
            --set cloudRun.service.serviceAccount=runtime@ccplant-test.iam.gserviceaccount.com \
            --set-string cloudRun.imageDigest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            >/dev/null

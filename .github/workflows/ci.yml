name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
        working-directory: backend
      - run: go build ./...
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run type-check
        working-directory: frontend
      - run: bun run test
        working-directory: frontend
      - run: bun run build
        working-directory: frontend

  charts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agentapi-proxy
            path: backend/helm/agentapi-proxy
            dependencies: true
          - name: agentapi-ui
            path: frontend/helm/agentapi-ui
            dependencies: false
          - name: ccplant
            path: chart/ccplant
            dependencies: true
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Build dependencies
        if: matrix.dependencies
        run: helm dependency build "${{ matrix.path }}"
      - run: helm lint "${{ matrix.path }}" --strict
      - name: Render chart
        run: helm template "${{ matrix.name }}" "${{ matrix.path }}" >/dev/null

  publish-dev-images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            image: ccplant/ccplant-backend
          - component: frontend
            image: ccplant/ccplant-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push development image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ghcr.io/${{ matrix.image }}:dev.ccplant.${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=dev-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.component }}

  publish-dev-chart:
    if: github.event_name == 'pull_request'
    needs: publish-dev-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Build dependencies
        run: helm dependency build chart/ccplant
      - name: Set development image tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          image_tag="dev.ccplant.${HEAD_SHA}"
          sed -i "s/^    tag: .*/    tag: ${image_tag}/" chart/ccplant/values.yaml
      - name: Package development chart
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_version="$(awk '/^version:/ { print $2; exit }' chart/ccplant/Chart.yaml)"
          short_sha="${HEAD_SHA:0:7}"
          helm package chart/ccplant \
            --version "${base_version}-dev.ccplant.${short_sha}" \
            --app-version "dev.ccplant.${HEAD_SHA}" \
            --destination dist
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Push development chart
        run: helm push "$(find dist -maxdepth 1 -name 'ccplant-*.tgz' -print -quit)" oci://ghcr.io/ccplant/charts

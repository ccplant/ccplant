name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      native: ${{ steps.filter.outputs.native }}
      charts: ${{ steps.filter.outputs.charts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect affected components
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          backend=false
          frontend=false
          native=false
          charts=false

          # A workflow change can affect every build, so exercise the complete CI.
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml)
                backend=true; frontend=true; native=true; charts=true ;;
              backend/helm/*|frontend/helm/*|chart/*)
                charts=true ;;
              backend/*)
                backend=true ;;
              frontend/*)
                frontend=true ;;
              native/*)
                native=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "charts=$charts" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
        working-directory: backend
      - run: go build ./...
        working-directory: backend

  api-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: matrix.arch == 'amd64' && github.event_name == 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API-only image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: api
          build-args: RELEASE_VERSION=${{ github.event_name == 'pull_request' && format('dev.ccplant.{0}', github.event.pull_request.head.sha) || 'test' }}
          platforms: ${{ matrix.platform }}
          push: ${{ matrix.arch == 'amd64' && github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/ccplant/ccplant-api:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
            ghcr.io/ccplant/ccplant-api:dev.ccplant.${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=api-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-image-${{ matrix.arch }}
      - name: Smoke-test API-only image
        if: matrix.arch == 'amd64' && github.event_name == 'pull_request'
        env:
          API_IMAGE: ghcr.io/ccplant/ccplant-api:dev.ccplant.${{ github.event.pull_request.head.sha }}
          EXPECTED_VERSION: dev.ccplant.${{ github.event.pull_request.head.sha }}
        run: |
          docker pull "$API_IMAGE"
          network=$(docker network create ccplant-api-test)
          redis_id=$(docker run --detach --network "$network" --name ccplant-api-test-redis redis:7-alpine)
          container_id=$(docker run --detach --network "$network" --env AGENTAPI_REDIS_ADDR=ccplant-api-test-redis:6379 --publish 127.0.0.1::8080 "$API_IMAGE")
          trap 'docker rm --force "$container_id" "$redis_id" >/dev/null; docker network rm "$network" >/dev/null' EXIT
          host_port=$(docker port "$container_id" 8080/tcp | sed 's/.*://')
          for attempt in {1..30}; do
            if test "$(curl --fail --silent "http://127.0.0.1:${host_port}/health" | jq -r .version)" = "$EXPECTED_VERSION"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          docker run --rm "$API_IMAGE" worker --help >/dev/null
          test "$(docker exec "$container_id" id -u)" = 999
          docker exec "$container_id" codex --version
          for command in claude cursor-agent docker git mise uv github-mcp-server otelcol node npm; do
            if docker exec "$container_id" sh -c "command -v $command"; then
              echo "unexpected runtime tool: $command"
              exit 1
            fi
          done

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run type-check
        working-directory: frontend
      - run: bun run test
        working-directory: frontend
      - run: bun run build
        working-directory: frontend

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
      - run: bun install --frozen-lockfile
        working-directory: native
      - run: bun run check
        working-directory: native
      - run: bun run sidecar:build
        working-directory: native
      - run: bun run tauri build --no-bundle
        working-directory: native

  charts:
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agentapi-proxy
            path: backend/helm/agentapi-proxy
            dependencies: true
          - name: agentapi-ui
            path: frontend/helm/agentapi-ui
            dependencies: false
          - name: ccplant
            path: chart/ccplant
            dependencies: true
          - name: session-manager
            path: chart/session-manager
            dependencies: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Build dependencies
        if: matrix.dependencies
        run: helm dependency build "${{ matrix.path }}"
      - run: helm lint "${{ matrix.path }}" --strict
      - name: Render chart
        run: helm template "${{ matrix.name }}" "${{ matrix.path }}" >/dev/null
      - name: Render Cloud Run manifest
        if: matrix.name == 'agentapi-proxy'
        run: |
          helm template agentapi-proxy "${{ matrix.path }}" \
            --show-only templates/cloud-run-service.yaml \
            --set cloudRun.enabled=true \
            --set cloudRun.service.name=ccplant-api-test \
            --set cloudRun.service.project=ccplant-test \
            --set cloudRun.service.region=asia-northeast1 \
            --set cloudRun.service.serviceAccount=runtime@ccplant-test.iam.gserviceaccount.com \
            --set-string cloudRun.imageDigest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            >/dev/null

  carry-forward-images:
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.backend != 'true' || needs.changes.outputs.frontend != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: release
        name: Resolve latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - name: Carry forward unchanged backend images
        if: needs.changes.outputs.backend != 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          for package in ccplant-backend ccplant-api; do
            docker buildx imagetools create \
              --tag "ghcr.io/ccplant/${package}:dev.ccplant.${HEAD_SHA}" \
              "ghcr.io/ccplant/${package}:${RELEASE_TAG}"
          done
      - name: Carry forward unchanged frontend image
        if: needs.changes.outputs.frontend != 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "ghcr.io/ccplant/ccplant-frontend:dev.ccplant.${HEAD_SHA}" \
            "ghcr.io/ccplant/ccplant-frontend:${RELEASE_TAG}"

  publish-dev-charts:
    needs: [changes, carry-forward-images]
    # carry-forward-images is skipped when every component is rebuilt.
    # always() lets chart publishing proceed in that case, but not after a failure.
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.carry-forward-images.result == 'success' || needs.carry-forward-images.result == 'skipped') &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.charts == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: agentapi-proxy
            path: backend/helm/agentapi-proxy
            base-version: 0.3.0
            dependencies: true
            component: backend
            image: ccplant/ccplant-backend
            build_image: true
          - name: agentapi-ui
            path: frontend/helm/agentapi-ui
            base-version: 0.1.0
            dependencies: false
            component: frontend
            image: ccplant/ccplant-frontend
            build_image: true
          - name: session-manager
            path: chart/session-manager
            base-version: 0.1.0
            dependencies: false
            component: backend
            image: ccplant/ccplant-backend
            build_image: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push development image
        if: >-
          matrix.build_image &&
          ((matrix.component == 'backend' && needs.changes.outputs.backend == 'true') ||
           (matrix.component == 'frontend' && needs.changes.outputs.frontend == 'true'))
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          build-args: ${{ matrix.component == 'backend' && format('RELEASE_VERSION=dev.ccplant.{0}', github.event.pull_request.head.sha) || '' }}
          push: true
          tags: ghcr.io/${{ matrix.image }}:dev.ccplant.${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=dev-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.component }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Build dependencies
        if: matrix.dependencies
        run: helm dependency build "${{ matrix.path }}"
      - name: Package development chart
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short_sha="${HEAD_SHA:0:7}"
          helm package "${{ matrix.path }}" \
            --version "${{ matrix.base-version }}-dev.ccplant.${short_sha}" \
            --app-version "dev.ccplant.${HEAD_SHA}" \
            --destination dist
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Push development chart
        env:
          CHART_NAME: ${{ matrix.name }}
        run: helm push "$(find dist -maxdepth 1 -name "${CHART_NAME}-*.tgz" -print -quit)" oci://ghcr.io/ccplant/charts
